<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Tefsir Kütüphanesi</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family:'Roboto',sans-serif; background:#f0f2f5; color:#333; height:100vh; display:flex; flex-direction:column; overflow:hidden;}

header {background:#1a472f; color:white; padding:10px 18px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;}
header h1 {font-size:17px; font-weight:700;}
header p {font-size:11px; opacity:0.85;}

.main-wrapper {display:flex; flex:1; overflow:hidden; position:relative;}

/* Sol Panel */
.left-panel {flex:1; overflow-y:auto; padding:15px; height:100%;}
.container {max-width:850px; margin:0 auto;}

/* Sağ Panel (PDF) */
.right-panel {width:50%; border-left:3px solid #1a472f; background:#e5e7eb; display:flex; flex-direction:column; height:100%; z-index:10;}
.right-panel.hidden {display:none;}

.section {background:white; margin-bottom:12px; padding:14px; border-radius:8px; border:1px solid #e1e4e8;}
.section-title {font-size:14px; font-weight:bold; color:#1a472f; margin-bottom:10px; border-bottom:2px solid #1a472f; padding-bottom:5px; display:flex; justify-content:space-between; align-items:center;}

label {display:block; font-size:12px; font-weight:bold; margin-bottom:4px; color:#555;}
input, select, textarea {width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:13px;}
input:focus, select:focus, textarea:focus {outline:none; border-color:#1a472f;}

button {background:#1a472f; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:500; font-size:12px; transition:0.2s;}
button:hover {background:#0f2818;}
button.blue {background:#0284c7;}
button.blue:hover {background:#0170a0;}
button.recording {background:#dc2626 !important; animation: pulse 1.2s infinite;}

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

.row {display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.arabic {font-family:'Amiri',serif; font-size:24px; direction:rtl; text-align:right; line-height:2.2; background:#fbfbfb; padding:12px; border-radius:6px; border-right:4px solid #1a472f; min-height:50px;}
.meal {font-size:14px; line-height:1.6; margin:10px 0 6px 0; color:#2c3e50;}

/* Sure Konu Kutusu */
.sure-ozet {background:#fef3c7; border:1px solid #fde68a; border-radius:6px; padding:8px 10px; font-size:12px; color:#78350f; margin-bottom:10px; line-height:1.4;}

/* Arama İstatistik Kutusu */
#aramaIstatistik {display:none; background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; padding:10px; margin-top:10px; font-size:12px; color:#1e40af;}
#aramaListe {max-height:130px; overflow-y:auto; margin-top:6px; padding-left:18px;}
#aramaListe li {margin-bottom:4px; cursor:pointer; text-decoration:underline;}

/* Sekmeler */
.tabs {display:flex; border-bottom:2px solid #ddd; margin-bottom:10px; overflow-x:auto;}
.tab-btn {background:none; color:#555; border:none; border-radius:0; padding:8px 12px; font-weight:bold; cursor:pointer; font-size:12px; white-space:nowrap;}
.tab-btn.active {color:#1a472f; border-bottom:3px solid #1a472f; background:#e8f0ec;}

.tab-content {display:none;}
.tab-content.active {display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:6px;}
.tab-content button {margin:0; width:100%; padding:8px 4px; text-align:center; font-size:11px; background:#fff; color:#1a472f; border:1px solid #1a472f;}
.tab-content button:hover {background:#1a472f; color:white;}

/* PDF Header */
.pdf-header {background:#1a472f; color:white; padding:8px 10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:5px;}
.pdf-header h3 {font-size:12px; font-weight:600;}
.pdf-controls {display:flex; align-items:center; gap:5px;}
.pdf-controls input {width:55px; padding:3px 6px; font-size:11px; height:26px;}
.pdf-controls button {padding:4px 8px; font-size:11px;}
.pdf-iframe {flex:1; border:none; width:100%; height:100%; background:#fff;}
</style>

        </div>

          <div id="istatistikOzet" style="font-weight:bold;"></div>
          <ul id="aramaListe"></ul>
        </div>
      </div>

      <!-- Ayet ve Meal -->
      <div class="section">
        <div class="section-title">

        </div>
        <div class="arabic" id="arap">Yükleniyor...</div>

        <div class="row" style="margin-top:10px;">
          <button onclick="geri()">◀ Önceki Ayet</button>
          <button onclick="ileri()">Sonraki Ayet ▶</button>
        </div>
      </div>

      <!-- Notlar -->
      <div class="section">
        <div class="section-title">Ayet Notu</div>
        <textarea id="not" rows="2" placeholder="Notunuzu buraya yazın veya sesli ekleyin..."></textarea>
        <button onclick="notKaydet()" style="margin-top:6px;">💾 Notu Kaydet</button>
      </div>

      <!-- Tefsir Sekmeleri -->
      <div class="section">
        <div class="section-title">Tefsir Kütüphanesi</div>
        <div class="tabs">
          <button class="tab-btn active" onclick="tabDegistir('isari', this)">✨ İşârî Tefsirler</button>
          <button class="tab-btn" onclick="tabDegistir('dirayet', this)">🔍 Dirâyet</button>
          <button class="tab-btn" onclick="tabDegistir('rivayet', this)">✅ Rivâyet</button>
          <button class="tab-btn" onclick="tabDegistir('cagdas', this)">🕰️ Çağdaş</button>
        </div>

        <div id="tab-isari" class="tab-content active"></div>
        <div id="tab-dirayet" class="tab-content"></div>
        <div id="tab-rivayet" class="tab-content"></div>
        <div id="tab-cagdas" class="tab-content"></div>
      </div>

    </div>
  </div>

  <!-- Sağ Panel: PDF & Kaldığın Sayfa -->
  <div class="right-panel hidden" id="rightPanel">
    <div class="pdf-header">
      <h3 id="pdfTitle">📄 Tefsir Görüntüleyici</h3>
      <div class="pdf-controls">

        <button onclick="closePdfViewer()">✕ Kapat</button>

    </div>
    <iframe class="pdf-iframe" id="pdfFrame" src=""></iframe>
  </div>
</div>

let sure = 1, ayet = 1;
let recognition = null, isRecording = false;
let aktifKitapId = "";

function init() {
  const sureSelect = document.getElementById("sure");
  sureSelect.innerHTML = sureListesi.map((s, idx) => `<option value="${idx + 1}">${s}</option>`).join('');

  ["isari", "dirayet", "rivayet", "cagdas"].forEach(t => {
    let container = document.getElementById("tab-" + t);
    kitaplar.filter(k => k.t === t).forEach(k => {
      let btn = document.createElement("button");
      btn.textContent = k.n;
      btn.onclick = () => acPdf(k.n, k.i);
      container.appendChild(btn);
    });
  });

  yeniAyet();
}

function sureDegisti() {
  document.getElementById("ayet").value = 1;
  yeniAyet();
}

function tabDegistir(tur, btnElement) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btnElement.classList.add('active');
  document.getElementById('tab-' + tur).classList.add('active');
}

async function yeniAyet() {
  sure = parseInt(document.getElementById("sure").value) || 1;
  ayet = parseInt(document.getElementById("ayet").value) || 1;
  document.getElementById("ayetKodu").textContent = `${sure}. Sure, ${ayet}. Ayet`;

  // Konu Özeti
  document.getElementById("sureKonusu").innerHTML = `<b>Sure Özeti:</b> ` + (sureKonulari[sure] || "Tevhid, ibadet, ahlak ve ahiret esasları.");

  // API'den Hem Arapça Hem Türkçe Meali Tek İstekte Alma (Garantili Çalışır)
  try {
    let res = await fetch(`https://api.alquran.cloud/v1/ayah/${sure}:${ayet}/editions/quran-uthmani,tr.diyanet`);
    let data = await res.json();
    if(data && data.data && data.data.length >= 2) {
      document.getElementById("arap").textContent = data.data[0].text;
      document.getElementById("meal").textContent = data.data[1].text;
    } else {
      document.getElementById("arap").textContent = "Metin bulunamadı.";
      document.getElementById("meal").textContent = "Meal bulunamadı.";
    }
  } catch(e) {
    document.getElementById("arap").textContent = "İnternet bağlantısı hatası.";
    document.getElementById("meal").textContent = "Meal alınamadı.";
  }

  // Not
  document.getElementById("not").value = localStorage.getItem(`tefsir_not_${sure}_${ayet}`) || "";
}

function geri() {
  if (ayet > 1) {
    ayet--;
    document.getElementById("ayet").value = ayet;
    yeniAyet();
  }
}

function ileri() {
  ayet++;
  document.getElementById("ayet").value = ayet;
  yeniAyet();
}

  try {
    let res = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(kelime)}/all/tr.diyanet`);
    let data = await res.json();

    if(data && data.data && data.data.matches && data.data.matches.length > 0) {
      let matches = data.data.matches;
      let totalCount = data.data.count;
      
      let sureFrekans = {};
      matches.forEach(m => {
        let sNo = m.surah.number;
        let sName = sureListesi[sNo-1] || m.surah.name;
        if(!sureFrekans[sNo]) {
          sureFrekans[sNo] = { name: sName, count: 0, ayetler: [] };
        }
        sureFrekans[sNo].count++;
        sureFrekans[sNo].ayetler.push(m.numberInSurah);
      });

      let sureSayisi = Object.keys(sureFrekans).length;
      ozet.innerHTML = `"${kelime}" kelimesi Kur'an'da <b>${sureSayisi} farklı surede</b> toplam <b>${totalCount} kez</b> geçmektedir:`;

      Object.keys(sureFrekans).forEach(sNo => {
        let item = sureFrekans[sNo];
        let li = document.createElement("li");
        li.innerHTML = `<b>${item.name}</b> (${item.count} kez) - Ayetler: ${item.ayetler.join(', ')}`;
        li.onclick = () => {
          document.getElementById("sure").value = sNo;
          document.getElementById("ayet").value = item.ayetler[0];
          yeniAyet();
        };
        liste.appendChild(li);
      });

      document.getElementById("sure").value = matches[0].surah.number;
      document.getElementById("ayet").value = matches[0].numberInSurah;
      yeniAyet();

    } else {
      ozet.textContent = `"${kelime}" kelimesi meallerde bulunamadı.`;
    }
  } catch(e) {
    ozet.textContent = "Arama sırasında bağlantı hatası oluştu.";
  }
}
