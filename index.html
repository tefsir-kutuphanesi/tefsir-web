<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DİJİTAL TEFSİR KÜTÜPHANESİ - 114 SURE DETAYLI TAHLİL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tefsir Kütüphanesi">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #f0f3f0;
            --bg-surface: #ffffff;
            --primary: #1b4d2e;
            --primary-dark: #123520;
            --accent: #c48c2b;
            --text-main: #1f2421;
            --text-muted: #55635a;
            --border: #d0ded5;
            --arabic-font: 'Amiri', serif;
        }

        .dark-mode {
            --bg-base: #0f1712;
            --bg-surface: #17221b;
            --primary: #2d7a46;
            --primary-dark: #1a4d2c;
            --text-main: #e8ede9;
            --text-muted: #8fa397;
            --border: #26382e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header {
            background: linear-gradient(135deg, #0e2417, var(--primary));
            color: #ffffff;
            padding: 0.5rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
            z-index: 10;
        }

        header h1 { font-size: 1.05rem; font-weight: 700; }
        header p { font-size: 0.7rem; color: #a4c9b3; }

        .btn-top {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(196,140,43,0.5);
            color: #fff;
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            body { overflow-y: auto; height: auto; }
        }

        .side-col {
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 0.7rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-card {
            background: var(--bg-base);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0.4rem;
        }

        label { display: block; font-size: 0.68rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.2rem; }
        select, input {
            width: 100%;
            padding: 0.35rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.8rem;
        }

        .search-box {
            background: var(--bg-base);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            gap: 0.3rem;
        }

        .btn-act {
            background: var(--primary);
            color: white;
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .arabic-text {
            font-family: var(--arabic-font);
            font-size: 1.5rem;
            direction: rtl;
            text-align: right;
            line-height: 1.8;
            color: var(--primary-dark);
            background: rgba(27, 77, 46, 0.05);
            padding: 0.5rem;
            border-radius: 6px;
            border-right: 3px solid var(--primary);
        }

        .meal-text { font-size: 0.85rem; line-height: 1.5; }

        .fihrist-box {
            background: #fffdf5;
            border: 1px solid #f0e2be;
            padding: 0.65rem;
            border-radius: 8px;
            font-size: 0.78rem;
            color: #5c3e0e;
            max-height: 220px;
            overflow-y: auto;
            line-height: 1.65;
        }

        .user-notes {
            width: 100%;
            height: 60px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem;
            line-height: 1.4;
            resize: vertical;
        }

        .shelf-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #202225;
            overflow: hidden;
        }

        .shelf-topbar {
            background: var(--bg-surface);
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .ekol-tab-btn {
            background: var(--bg-base);
            border: 1.5px solid var(--border);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-main);
        }
        .ekol-tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .search-shelf {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            width: 140px;
            margin-left: auto;
        }

        .reader-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100% - 50px);
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .reader-grid { grid-template-columns: 1fr; }
        }

        .outline-sidebar {
            background: #18191c;
            border-right: 1px solid #36393f;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .sidebar-tabs {
            padding: 0.55rem 0.75rem;
            background: #202225;
            border-bottom: 1px solid #36393f;
            font-size: 0.78rem;
            font-weight: 700;
            color: #b9bbbe;
            display: flex;
            justify-content: space-between;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .sidebar-content::-webkit-scrollbar { width: 8px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .book-tab-btn {
            background: #2f3136;
            color: #dcddde;
            border: 1px solid #40444b;
            padding: 0.6rem 0.7rem;
            border-radius: 6px;
            text-align: left;
            font-size: 0.78rem;
            cursor: pointer;
            line-height: 1.35;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .book-tab-btn:hover { background: #40444b; color: #fff; }
        .book-tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
        .book-tab-btn strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

        #pdf-viewer-wrap {
            overflow: auto;
            background: #525659;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem 0;
            position: relative;
            flex: 1;
        }

        #pdf-canvas { display: block; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }

        #pdf-toolbar {
            display: flex;
            background: #18191c;
            border-bottom: 1px solid #36393f;
            padding: 0.45rem 0.75rem;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        #pdf-sayfa-bilgi, #pdf-zoom-bilgi { color: #dcddde; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
        #pdf-sayfa-slider { width: 110px; accent-color: var(--primary); cursor: pointer; }

        #modal-ara {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-box {
            background: var(--bg-surface); width: 850px; max-width: 95%; max-height: 80vh;
            border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem;
        }
        .modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; max-height: 60vh; }
        .m-item { padding: 0.5rem; border: 1px solid var(--border); border-radius: 5px; cursor: pointer; background: var(--bg-base); }
    </style>
</head>
<body>

<div id="modal-ara">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 0.95rem; color: var(--primary);">Kur'an Arama Sonuçları</strong>
            <button class="btn-act" style="background:#dc2626; padding:0.25rem 0.5rem;" onclick="document.getElementById('modal-ara').style.display='none'">Kapat ✕</button>
        </div>
        <div class="modal-list" id="m-sonuc"></div>
    </div>
</div>

<header>
    <div>
        <h1>DİJİTAL TEFSİR KÜTÜPHANESİ</h1>
        <p>114 Sure Özel Tahlili & Kalıcı Külliyat Portalı</p>
    </div>
    <div style="display: flex; gap: 0.4rem;">
        <button class="btn-top" onclick="notIndir()">💾 Notları İndir</button>
        <button class="btn-top" onclick="document.body.classList.toggle('dark-mode')">🌙 Gece Modu</button>
    </div>
</header>

<div class="main-layout">
    <div class="side-col">
        <div class="nav-card">
            <div>
                <label>Sure Seçin</label>
                <select id="sure-sec" onchange="sureDegisti()"></select>
            </div>
            <div>
                <label>Ayet No</label>
                <input type="number" id="ayet-sec" value="1" min="1" onchange="ayetYukle()">
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="ara-inp" placeholder="Kur'an'da ara..." onkeydown="if(event.key==='Enter') kuranAra()">
            <button class="btn-act" onclick="kuranAra()">🔍 Ara</button>
            <button class="btn-act" style="background:#0284c7;" onclick="sesCal()">🔊 Dinle</button>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="font-size: 0.8rem; color: var(--primary);">DİYANET İŞLERİ MEALİ</strong>
                <button class="btn-top" style="background:var(--bg-base); color:var(--text-main); border:1px solid var(--border);" onclick="kopyala()">📋 Kopyala</button>
            </div>
            <div class="arabic-text" id="ar-metin">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div class="meal-text" id="tr-metin">Rahmân ve Rahîm olan Allah'ın adıyla.</div>
        </div>

        <div class="card">
            <strong style="font-size: 0.8rem; color: var(--accent);">📖 SURE ÖZETİ VE KONU DAĞILIMI:</strong>
            <div class="fihrist-box" id="fihrist-metin">Yükleniyor...</div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label>📝 Bu Ayet Hakkında Kişisel Notunuz:</label>
                <button class="btn-act" style="padding:0.2rem 0.5rem;" onclick="sesleYaz()">🎙️ Sesle Yaz</button>
            </div>
            <textarea class="user-notes" id="not-alani" placeholder="Ayet hakkındaki notlarınızı buraya yazın..." oninput="notKaydet()"></textarea>
        </div>
    </div>

    <div class="shelf-panel">
        <div class="shelf-topbar">
            <button class="ekol-tab-btn active" onclick="ekolDegistir(this, 'hepsi')">Tüm Tefsirler</button>
            <button class="ekol-tab-btn" onclick="ekolDegistir(this, 'rivayet')">Rivâyet</button>
            <button class="ekol-tab-btn" onclick="ekolDegistir(this, 'dirayet')">Dirâyet</button>
            <button class="ekol-tab-btn" onclick="ekolDegistir(this, 'isari')">İşârî</button>
            <input type="text" class="search-shelf" id="search-shelf" placeholder="Külliyatta ara..." oninput="kitapFiltrele()">
        </div>

        <div class="reader-grid">
            <div class="outline-sidebar">
                <div class="sidebar-tabs">
                    <span>KÜLLİYAT / ESERLER</span>
                    <span id="kitap-sayisi" style="font-size:0.75rem; color:#8fa397;">0 Kitap</span>
                </div>
                <div class="sidebar-content" id="kitap-listesi"></div>
            </div>

            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden; background:#36393f;">
                <div id="pdf-toolbar">
                    <button class="btn-top" onclick="pdfOncekiSayfa()">◀ Önceki</button>
                    <input type="range" id="pdf-sayfa-slider" min="1" max="1" value="1" oninput="pdfSliderDegisti(this.value)">
                    <span id="pdf-sayfa-bilgi">1 / 1</span>
                    <button class="btn-top" onclick="pdfSonrakiSayfa()">Sonraki ▶</button>
                    <div style="margin-left:auto; display:flex; gap:0.3rem; align-items:center;">
                        <button class="btn-top" onclick="pdfZoom(0.15)">🔍 +</button>
                        <span id="pdf-zoom-bilgi">%100</span>
                        <button class="btn-top" onclick="pdfZoom(-0.15)">🔍 -</button>
                    </div>
                </div>

                <div id="pdf-viewer-wrap">
                    <canvas id="pdf-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
